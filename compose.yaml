name: homedocs

services:
  app:
    # Built and pushed by GitHub Actions. No `build:` block: this stack only pulls.
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/homedocs:main}
    # `:main` is a mutable tag and `docker compose up` will not re-pull a tag that
    # already exists locally. Without this the redeploy keeps running old code.
    pull_policy: always
    restart: unless-stopped
    environment:
      # The password travels beside the URL, not inside it: postgres-js parses the
      # URL with `new URL()`, and a `/` in the password breaks it.
      DATABASE_URL: postgres://homedocs@db:5432/homedocs
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Encrypts stored secrets and integration tokens. Separate from
      # SESSION_SECRET so signing everyone out does not destroy them. Back it up.
      INTEGRATIONS_KEY: ${INTEGRATIONS_KEY:?set INTEGRATIONS_KEY}
      # The external HTTPS origin. OAuth discovery and share links are built from it.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      DATA_DIR: /data
      # Where the pre-migration snapshot is written (shared with `backup`).
      BACKUP_DIR: /backups
      # Proxies in front of the app; the client address is that many entries from
      # the right of X-Forwarded-For. Behind Cloudflare, set CLIENT_IP_HEADER.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Single sign-on. Off unless issuer, id and secret are all set; two of three
      # fails the boot. Redirect URI: ${PUBLIC_BASE_URL}/login/oidc/callback.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_ONLY: ${OIDC_ONLY:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      # Role for a sign-on that matches no account: viewer (default) or member.
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - files:/data
      - backups:/backups
    healthcheck:
      # The entrypoint applies migrations before the server listens, hence the
      # longer start_period.
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Caddy reaches the app over the shared `web` network as homedocs-app-1:3000
    # (alias `homedocs`). No published port: Caddy sets X-Real-IP, which the app
    # trusts, so the app must not be reachable except through Caddy.
    networks:
      default:
      web:
        aliases: [homedocs]

  db:
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: homedocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: homedocs
    volumes:
      # PG18 keeps data in a version subdirectory and wants the mount at
      # /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homedocs']
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly logical dump of the database, kept 30 days. Photos are primary data
  # here (there is no other copy), so the `files` and `backups` volumes both
  # belong in the host's offsite backup — see docs/DEPLOYMENT.md.
  backup:
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: homedocs
      PGDATABASE: homedocs
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-3}
      TZ: ${TZ:-America/New_York}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        dump() {
          f="/backups/homedocs-$$(date +%Y%m%d-%H%M%S).dump"
          pg_dump -Fc -f "$$f.partial" && mv "$$f.partial" "$$f" && echo "backup: wrote $$f"
          find /backups -name 'homedocs-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
        }
        dump
        while true; do
          sleep 3600
          [ "$$(date +%H)" -eq "$$BACKUP_AT_HOUR" ] && dump || true
        done

networks:
  # The reverse proxy's network, created outside this stack.
  web:
    external: true

volumes:
  pgdata18:
  files:
  backups:
